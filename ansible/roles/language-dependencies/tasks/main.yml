---
- name: Language dependencies in Debian
  when: ansible_os_family == 'Debian'
  become: true
  ansible.builtin.apt:
    name:
      - libssl-dev
      - libyaml-dev
      - libgdbm-dev
      - libgdbm-compat-dev
      - liblzma-dev
      - xz-utils
      - libncurses-dev
      - libreadline-dev
      - lzma
      - tk-dev
      - uuid-dev
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600
