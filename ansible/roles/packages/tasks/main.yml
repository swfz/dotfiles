---
- name: Install apt-packages
  ansible.builtin.apt:
    name:
      - curl
      - bash-completion
      - gcc
      - make
      - tar
      - zsh
      - xclip
      - unzip
      - dos2unix
      - openssl
      - universal-ctags
      - nkf
      - zlib1g-dev
      - libffi-dev
      - autogen
      - automake
      - libperl-dev
      - libbz2-dev
      - imagemagick
      - ubuntu-wsl
      - gnuplot
      - sqlite3
      - libsqlite3-dev
      - inotify-tools
      - silversearcher-ag
      - colorized-logs
      - crudini
      - asciinema
      - libasound2t64
      - net-tools
      - tree
      - bubblewrap
      - socat
      - wl-clipboard
    state: present
    update_cache: true
    cache_valid_time: 3600

# 26.04 (resolute) のアーカイブには translate-shell が無い
- name: Install translate-shell
  when: ansible_distribution_version is version('26.04', '<')
  ansible.builtin.apt:
    name: translate-shell
    state: present
