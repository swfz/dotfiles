---
# chunk分割時はバックエンドが使うツール(node/pnpm/python/uv)やgcloudのCLOUDSDK_PYTHONが
# 先に入っている必要があるため、依存だけ別で先にインストールする
- name: Install tool dependencies  # noqa command-instead-of-shell
  environment:
    PATH: /usr/local/bin:{{ ansible_env.PATH }}
  ansible.builtin.shell: "{{ execute }} 'MISE_DISABLE_HOOKS=1 mise -y i {{ ansible_env.get('TOOLS_DEPS', '') }}'"
  when: ansible_env.get('TOOLS_DEPS', '') != ''
  changed_when: true

- name: Install global tools  # noqa command-instead-of-shell
  environment:
    PATH: /usr/local/bin:{{ ansible_env.PATH }}
  ansible.builtin.shell: "{{ execute }} 'MISE_DISABLE_HOOKS=1 mise -y i {{ ansible_env.get('TOOLS', '') }}'"
  changed_when: true
