---
# 環境変数CIがそもそも存在しないか、設定されていてもtrueではない
- name: Set git repo prefix(git)  # noqa var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    repo_prefix: 'git@github.com:'
  when: ansible_env.CI is not defined or ansible_env.CI != "true"

# CI環境
- name: Set git repo prefix(https)  # noqa var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    repo_prefix: https://github.com/
  when: ansible_env.get('CI', '') == "true"

- name: Command directory
  ansible.builtin.file:
    path: "{{ command_dir }}"
    state: directory
    mode: "0755"

- name: Set git config
  ansible.builtin.template:
    src: config.j2
    dest: ~/.gitconfig
    owner: "{{ user }}"
    mode: "0644"

- name: Check repository directory exists  # noqa var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ dotfiles.dest }}"
  register: dotfiles_dir

- name: Check unstaged changes  # noqa command-instead-of-module var-naming[no-role-prefix]
  ansible.builtin.command:
    cmd: git diff --exit-code
    chdir: "{{ dotfiles.dest }}"
  register: repo_changed
  ignore_errors: true
  changed_when: repo_changed.rc != 0
  when: dotfiles_dir.stat.exists

- name: Stash Changes  # noqa command-instead-of-module
  ansible.builtin.command: git stash
  when: repo_changed is defined and repo_changed.rc is defined and repo_changed.rc != 0
  changed_when: true

# CIではPRのブランチを検証したいためDOTFILES_REFで上書きできるようにする
# 未指定なら従来どおりデフォルトブランチ(HEAD)をclone
- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ repo_prefix }}{{ dotfiles.src.repo }}"
    dest: "{{ dotfiles.dest }}"
    version: "{{ ansible_env.get('DOTFILES_REF', 'HEAD') }}"
    clone: true
    update: true
    force: true

- name: Pop stash changes  # noqa command-instead-of-module
  ansible.builtin.command: git stash pop
  when: repo_changed is defined and repo_changed.rc is defined and repo_changed.rc != 0
  changed_when: true

- name: Symlink bat config
  ansible.builtin.file:
    path: ~/.config/bat
    state: directory
    mode: "0755"

- name: Symlink bat config
  ansible.builtin.file:
    src: "{{ dotfiles.dest }}/config/bat/config"
    dest: ~/.config/bat/config
    state: link

- name: Symlink mise config
  ansible.builtin.file:
    path: ~/.config/mise
    state: directory
    mode: "0755"

- name: Symlink mise config
  ansible.builtin.file:
    src: "{{ dotfiles.dest }}/config/mise/config.toml"
    dest: ~/.config/mise/config.toml
    state: link

# apm(Agent Package Manager)のグローバルマニフェストとロック
# NOTE: 既存マシンでは~/.apm配下に実ファイルがあるためforceでsymlinkに置き換える
- name: Symlink apm config
  ansible.builtin.file:
    path: ~/.apm
    state: directory
    mode: "0755"

- name: Symlink apm config
  ansible.builtin.file:
    src: "{{ dotfiles.dest }}/config/apm/{{ item }}"
    dest: ~/.apm/{{ item }}
    state: link
    force: true
  with_items:
    - apm.yml
    - apm.lock.yaml

# NOTE: CIではdotfilesをデフォルトブランチからcloneするため、
# 未マージブランチで追加されたconfig/nvimがsrcに存在しない。force指定で許容する
- name: Symlink nvim config
  ansible.builtin.file:
    src: "{{ dotfiles.dest }}/config/nvim"
    dest: ~/.config/nvim
    state: link
    force: true

- name: Symlink starship config
  ansible.builtin.file:
    src: "{{ dotfiles.dest }}/config/starship/starship.toml"
    dest: ~/.config/starship.toml
    state: link

- name: Store bin path to zshenv
  ansible.builtin.lineinfile:
    dest: ~/.zshenv
    state: present
    create: true
    line: "{{ item }}"
    mode: "0644"
  with_items:
    - export PATH="$HOME/dotfiles/bin:$PATH"
    - export PATH="$HOME/.local/share/mise/shims:$PATH"

- name: Symlink dotfiles
  ansible.builtin.file:
    src: "{{ dotfiles.dest }}/{{ item }}"
    dest: ~/{{ item }}
    state: link
  with_items: "{{ dotfiles.files }}"

- name: .vim directory
  ansible.builtin.file:
    path: ~/.vim
    state: directory
    mode: "0755"

- name: Symlink vim snippet
  ansible.builtin.file:
    src: "{{ dotfiles.dest }}/.vim/snippets"
    dest: ~/.vim/snippets
    state: link

- name: Symlink sshrc.d
  ansible.builtin.file:
    src: "{{ dotfiles.dest }}/.sshrc.d"
    dest: ~/.sshrc.d
    state: link

# git-hooksのセットアップ
- name: Clone git-hooks repository
  ansible.builtin.git:
    repo: "{{ repo_prefix }}{{ git_hooks.src.repo }}"
    dest: "{{ git_hooks.dest }}"
    clone: true
    update: true
    force: true
