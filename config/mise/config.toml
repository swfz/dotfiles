[tools]
node = '24.22.1'
ruby = '4.0.7'
go = '1.27.3'
gcloud = 'latest'
awscli = '2.38.5'
deno = 'latest'
jq = '1.8.2'
bat = '0.26.1'
delta = '0.20.1'
terraform = '1.17.0'
# 3.12.12はgcloudのCLOUDSDK_PYTHON用(gcloudは新しいpythonをサポートしないため別で保持する)
python = ['3.14.8', '3.12.12']
pipx = 'latest'
act = 'latest'
vim = 'latest'
yq = 'latest'
uv = 'latest'
fillin = 'latest'
bun = 'latest'
# npm:pnpmはpnpm自身でインストールしようとして循環するためregistry(aqua)の単体バイナリを使う
pnpm = 'latest'
eza = 'latest'
vivid = 'latest'
ripgrep = 'latest'
fzf = 'latest'
neovim = 'latest'
tmux = '3.7c'
apm = 'latest'
"npm:zx" = 'latest'
"npm:opencommit" = 'latest'
"npm:yarn" = 'latest'
"npm:@google/clasp" = 'latest'
"npm:@github/copilot" = 'latest'
"npm:@openai/codex" = 'latest'
"npm:@google/gemini-cli" = 'latest'
"pipx:mycli" = 'latest'
"pipx:cheat" = 'latest'
"pipx:mkdocs" = 'latest'
"pipx:jc" = 'latest'
"pipx:visidata" = 'latest'
"pipx:cisco-ai-skill-scanner" = '2.3.1'
ollama = 'latest'
rust = 'latest'
ghq = "1.11.2"
"github:dlvhdr/diffnav" = 'latest'
sqlite = 'latest'
# ubiバックエンドはOS/libcの判別が甘くglibc環境(WSL/Ubuntu)でmusl版を掴むことがある(ELFローダー無しでexec不可)。
# githubバックエンドはOS/arch/libcを自動判別しMac/Linux両対応するため、GitHub Releasesから取るツールはすべてこちらを使う
"github:duckdb/duckdb" = 'latest'
"github:alltuner/mise-completions-sync" = "latest"
"github:k1LoW/mo" = "latest"
"github:sxyazi/yazi" = "latest"
ffmpeg = "latest"
gh = "2.103.0"
rclone = "latest"
lefthook = "latest"
golangci-lint = "2.15.0"

[hooks]
postinstall = "misecompsync --shell zsh"

[settings]
experimental = true
minimum_release_age = "7d"

[settings.npm]
package_manager = "pnpm"

[env]
GOOGLE_APPLICATION_CREDENTIALS="{{env.HOME}}/.config/gcloud/private_adc.json"
CLOUDSDK_PYTHON="{{env.HOME}}/.local/share/mise/installs/python/3.12.12/bin/python3"

