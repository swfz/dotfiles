---
name: test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ccsync:
    runs-on: ubuntu-latest
    name: 'ccsync'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run ccsync test
        run: bash tests/ccsync_test.sh

  tmux-layout:
    runs-on: ubuntu-latest
    name: 'tmux-layout'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # yq(mikefarah 版)と jq は ubuntu-latest に入っているものを使う
      - name: run tmux layout test
        run: bash tests/tmux_layout_test.sh

  shfmt:
    runs-on: ubuntu-latest
    name: 'shfmt'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/rdpick/go.mod
          cache: false
      - name: shfmt -d
        # 書式の設定は .editorconfig
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          git ls-files -z | xargs -0 shfmt -f | xargs shfmt --apply-ignore -d

  rdpick:
    runs-on: ubuntu-latest
    name: 'rdpick'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/rdpick
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/rdpick/go.mod
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        # カバレッジが閾値を下回ったら失敗させる(ローカルでの再現方法は src/rdpick/README.md)
        env:
          COVERAGE_THRESHOLD: 80
        run: |
          go test -coverprofile="$RUNNER_TEMP/c.out" ./...
          total=$(go tool cover -func="$RUNNER_TEMP/c.out" | awk '/^total:/{gsub("%","",$3); print $3}')
          echo "coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v min="$COVERAGE_THRESHOLD" 'BEGIN{exit !(t>=min)}'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: src/rdpick

  statusline:
    runs-on: ubuntu-latest
    name: 'statusline'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # jq は ubuntu-latest に入っているものを使う
      - name: run statusline test
        run: bash tests/statusline_test.sh

  claude-session:
    runs-on: ubuntu-latest
    name: 'claude-session'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # python3 は ubuntu-latest に入っているものを使う(標準ライブラリのみ)
      - name: run claude-session test
        run: bash tests/claude_session_test.sh

  python-unittest:
    runs-on: ubuntu-latest
    name: 'python-unittest'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # python3 は ubuntu-latest に入っているものを使う(標準ライブラリの unittest のみ)
      - name: unittest
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  python-typecheck:
    runs-on: ubuntu-latest
    name: 'python-typecheck'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-dependency-glob: uv.lock
      - name: install mypy
        run: uv sync --locked
      - name: mypy
        # 対象ファイルは pyproject.toml の [tool.mypy] files
        run: uv run mypy
