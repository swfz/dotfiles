name: タスク
description: エージェントが着手・完了判定できる形でタスクを起票する
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ必要か。何が困っているか
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: やること
      description: 具体的な作業。ファイル名・スクリプト名まで書けるとよい
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 機械的に確認できる条件を「コマンド → 期待結果」で書く
      placeholder: |
        - `bash tests/ccsync_test.sh` が成功する
        - `cd src/rdpick && go test ./...` が成功する
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 範囲外
      description: この Issue ではやらないこと
